name: MineDB Self-Bootstrapping Pipeline

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run-kaggle-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Kaggle CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Configure Kaggle credentials & push kernel (Run All)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kaggle ~/.config/kaggle
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            KEY_VAL="${KAGGLE_API_TOKEN}"
          elif [ -n "${KAGGLE_KEY:-}" ]; then
            KEY_VAL="${KAGGLE_KEY}"
          else
            echo "::error::Neither KAGGLE_API_TOKEN nor KAGGLE_KEY secret is set."
            exit 1
          fi

          cat > ~/.kaggle/kaggle.json <<EOF
          {"username":"${KAGGLE_USERNAME}","key":"${KEY_VAL}"}
          EOF
          chmod 600 ~/.kaggle/kaggle.json
          cp ~/.kaggle/kaggle.json ~/.config/kaggle/kaggle.json
          chmod 600 ~/.config/kaggle/kaggle.json

          # Resolve notebook path in repo (supports root or notebooks/ folder)
          NOTEBOOK_SRC="minedb_unified_pipeline_14b.ipynb"
          if [ ! -f "$NOTEBOOK_SRC" ] && [ -f "notebooks/minedb_unified_pipeline_14b.ipynb" ]; then
            NOTEBOOK_SRC="notebooks/minedb_unified_pipeline_14b.ipynb"
          fi

          WORK_DIR="/tmp/kaggle_kernel_push"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          cp "$NOTEBOOK_SRC" "$WORK_DIR/minedb_unified_pipeline_14b.ipynb"

          KERNEL_SLUG="${KAGGLE_USERNAME}/minedb-unified-pipeline"

          cat > "$WORK_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KERNEL_SLUG}",
            "title": "MineDB Unified Pipeline",
            "code_file": "minedb_unified_pipeline_14b.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [
              "${KAGGLE_USERNAME}/minedb-cache-3b-v1",
              "${KAGGLE_USERNAME}/minedb-runtime-secrets"
            ],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF

          # 'kaggle kernels push' uploads the notebook and triggers a run on Kaggle
          kaggle kernels push -p "$WORK_DIR"

      - name: Monitor Kaggle notebook execution until completion
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          KERNEL_SLUG="${KAGGLE_USERNAME}/minedb-unified-pipeline"
          echo "Monitoring Kaggle kernel execution for ${KERNEL_SLUG}..."

          # Give Kaggle a moment to initialize the run after push
          sleep 10

          DEADLINE=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS_OUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
            echo "$(date -u +'%H:%M:%S UTC') -> ${STATUS_OUT}"

            if echo "$STATUS_OUT" | grep -qiE "complete"; then
              echo "Kaggle notebook run completed."
              break
            fi

            if echo "$STATUS_OUT" | grep -qiE "error|failed|cancel"; then
              echo "::error::Kaggle notebook execution ended in error/failed/cancelled state: ${STATUS_OUT}"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for Kaggle notebook run after 3600s."
              exit 1
            fi

            sleep 25
          done

          mkdir -p /tmp/kaggle_kernel_output
          kaggle kernels output "$KERNEL_SLUG" -p /tmp/kaggle_kernel_output || true
          if [ -f /tmp/kaggle_kernel_output/*.log ]; then
            tail -n 50 /tmp/kaggle_kernel_output/*.log || true
          fi
