name: MineDB Daily Kaggle Pipeline

on:
  schedule:
    # Runs every day at 02:00 UTC (06:00 AM UAE / GST)
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'minedb_unified_pipeline_14b.ipynb'
      - 'kernel-metadata.json'
      - '.github/workflows/run_minedb_kaggle.yml'
  workflow_dispatch:

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle six

      - name: Sync private secrets dataset & prepare kernel-metadata.json
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          KAGGLE_USERNAME_VAR: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_USERNAME_SECRET: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python - << 'EOF'
          import json, os, shutil, subprocess

          username = (
              os.environ.get("KAGGLE_USERNAME_VAR", "").strip()
              or os.environ.get("KAGGLE_USERNAME_SECRET", "").strip()
              or "sarangathenuwara"
          )

          # 1. Sync runtime secrets into a private Kaggle Dataset
          sec_dir = "/tmp/minedb_secrets_pkg"
          shutil.rmtree(sec_dir, ignore_errors=True)
          os.makedirs(sec_dir, exist_ok=True)

          secrets_ds_id = f"{username}/minedb-runtime-secrets"
          with open(os.path.join(sec_dir, "secrets.json"), "w", encoding="utf-8") as f:
              json.dump({
                  "MOTHERDUCK_TOKEN": os.environ["MOTHERDUCK_TOKEN"].strip(),
                  "KAGGLE_USERNAME": username,
                  "KAGGLE_API_TOKEN": os.environ["KAGGLE_API_TOKEN"].strip(),
              }, f)

          with open(os.path.join(sec_dir, "dataset-metadata.json"), "w", encoding="utf-8") as f:
              json.dump({
                  "title": "MineDB Runtime Secrets",
                  "id": secrets_ds_id,
                  "licenses": [{"name": "CC0-1.0"}],
              }, f, indent=2)

          sec_status = subprocess.run(["kaggle", "datasets", "status", secrets_ds_id], capture_output=True, text=True)
          if sec_status.returncode == 0:
              subprocess.run(
                  ["kaggle", "datasets", "version", "-p", sec_dir, "-m", "Sync runtime secrets", "--dir-mode", "zip"],
                  check=True,
              )
          else:
              subprocess.run(
                  ["kaggle", "datasets", "create", "-p", sec_dir, "--dir-mode", "zip"],
                  check=True,
              )
          shutil.rmtree(sec_dir, ignore_errors=True)

          # 2. Update kernel-metadata.json with kernel slug and dataset_sources
          meta_path = "kernel-metadata.json"
          with open(meta_path, "r", encoding="utf-8") as f:
              meta = json.load(f)

          slug = meta["id"].split("/", 1)[1]
          meta["id"] = f"{username}/{slug}"

          datasets = [secrets_ds_id]
          cache_ds_id = f"{username}/minedb-cache-14b-awq"
          cache_check = subprocess.run(["kaggle", "datasets", "status", cache_ds_id], capture_output=True, text=True)
          if cache_check.returncode == 0:
              datasets.append(cache_ds_id)
              print(f"Attached existing cache dataset: {cache_ds_id}")
          else:
              print(f"Cache dataset {cache_ds_id} not created yet; notebook will auto-bootstrap it on first run.")

          meta["dataset_sources"] = datasets
          with open(meta_path, "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)

          with open(os.environ["GITHUB_ENV"], "a") as env_f:
              env_f.write(f"KERNEL_ID={meta['id']}\n")
          print(f"Configured kernel target: {meta['id']}")
          EOF

      - name: Push & Trigger Kaggle GPU Notebook (Fire & Forget)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p . --accelerator NvidiaTeslaT4
          echo "Triggered https://www.kaggle.com/code/$KERNEL_ID — exiting GitHub Actions immediately."
